# 中研院網球場預約系統配置檔

target:
  date: "09/05"                    # 目標日期 (MM/DD)
  day_num: "05"                    # 日期數字 (日曆比對用)
  primary_slots:                   # 首選目標時段 (今晚 09/02 開放 19:00)
    - "19:00"
  court_order:                     # 場地優先級順序
    - "B"
    - "A"
  fallback_time_range:             # 撿漏範圍 (14:00 <= 開始時間 < 17:00)
    min_hour: 14
    max_hour: 17

system:
  url: "https://gym.dga.sinica.edu.tw/reservation.html"
  state_file: "C:\\Users\\artce\\scripts\\state.json"
  state_backup_file: "D:\\My_Projects\\courtBooking\\state.json"
  log_file: "C:\\Users\\artce\\scripts\\booking.log"
  screenshot_dir: "C:\\Users\\artce\\scripts"
  preheat_minutes: 5               # 提前幾分鐘進入頁面預熱 (預設 23:55)
  refresh_attempts: 40             # 00:00 後最大重試刷新次數
  refresh_interval_ms: 300         # 重試間隔毫秒數

time_sync:
  enabled: true
  ntp_server: "time.stdtime.gov.tw"
  fallback_http_url: "https://gym.dga.sinica.edu.tw/reservation.html"

telegram:
  enabled: false
  bot_token: ""
  chat_id: ""
